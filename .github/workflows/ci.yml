name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run Ruff
        run: ruff check gcap tests

      - name: Run strict mypy
        if: matrix.python-version == '3.11'
        run: mypy gcap

      - name: Check architecture contracts
        run: lint-imports

      - name: Run test suite
        run: python -m pytest -q

  release-package:
    name: Build release artifacts
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean source archives
        run: scripts/package_release.sh gcap-2.3.1.dev0

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gcap-2.3.1.dev0
          path: |
            gcap-2.3.1.dev0.tar.gz
            gcap-2.3.1.dev0.zip
          if-no-files-found: error
