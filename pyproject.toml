[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcap"
version = "2.3.1.dev0"
description = "G-CAP: Governed Agentic AI Architecture for Capital Allocation, Treasury and Portfolio Decision-Making"
authors = [{ name = "Ugur Alkan" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "cryptography>=42.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1; sys_platform != 'emscripten'",
    "httpx>=0.27",
    "tenacity>=8.2",
    "click>=8.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "scipy-stubs>=1.11",
    "pandas-stubs>=2.1",
]

[project.scripts]
gcap = "gcap.harness.cli:main"

[tool.setuptools.packages.find]
include = ["gcap*"]

[tool.setuptools.package-data]
"gcap.migrations" = ["README", "script.py.mako"]

[tool.ruff]
line-length = 100
target-version = "py311"
# alembic/versions/* is Alembic-autogenerated boilerplate, regenerated by
# `alembic revision --autogenerate` on every schema change — never
# hand-edited, so it is excluded the same way it is from mypy (below)
# rather than reformatted after every autogenerate.
extend-exclude = ["gcap/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "gcap/migrations/"]

# statsmodels ships no inline types and no stub package exists on PyPI
# (checked: no `statsmodels-stubs` distribution). This is the one
# import-untyped exemption in the codebase; every other third-party
# dependency is fully typed (scipy-stubs, pandas-stubs installed).
[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["gcap"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "gcap"

[[tool.importlinter.contracts]]
name = "core stays deterministic: no LLM client or agents import"
type = "forbidden"
source_modules = ["gcap.core"]
forbidden_modules = ["gcap.agents", "gcap.graph", "gcap.harness"]

[[tool.importlinter.contracts]]
name = "agents cannot see oracle, sealed labels, or bench case-authoring internals"
type = "forbidden"
source_modules = ["gcap.agents"]
forbidden_modules = ["gcap.oracle", "gcap.bench"]

[[tool.importlinter.contracts]]
name = "graph stays blind to ground truth: no oracle or bench import in the decision path"
type = "forbidden"
source_modules = ["gcap.graph"]
forbidden_modules = ["gcap.oracle", "gcap.bench"]

[[tool.importlinter.contracts]]
name = "analysis reads recorded data only"
type = "forbidden"
source_modules = ["gcap.analysis"]
forbidden_modules = ["gcap.agents", "gcap.graph", "gcap.harness"]

[[tool.importlinter.contracts]]
name = "oracle imports core only, never agents/graph/bench/config/store/analysis"
type = "forbidden"
source_modules = ["gcap.oracle"]
forbidden_modules = [
    "gcap.agents",
    "gcap.graph",
    "gcap.harness",
    "gcap.bench",
    "gcap.config",
    "gcap.store",
    "gcap.analysis",
]
